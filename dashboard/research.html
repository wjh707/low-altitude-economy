// ===== ECharts Dark Theme =====
const CHART_BG = 'transparent';
const CHART_TEXT = '#6b8cbe';
const CHART_AXIS = '#1a2d52';
const CHART_COLORS = ['#3b82f6', '#22d3ee', '#34d399', '#f59e0b', '#f472b6', '#6366f1', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];

// ===== Initialize =====
async function init() {
  let data = null;
  try {
    const resp = await fetch('../data/analysis_data.json').catch(() => null);
    if (resp && resp.ok) {
      data = await resp.json();
    }
  } catch(e) {}
  if (!data) {
    data = EMBEDDED_ANALYSIS_DATA;
  }
  if (!data) {
    document.getElementById('loadingOverlay').querySelector('.loading-text').textContent = '❌ 数据加载失败';
    return;
  }

  document.getElementById('loadingOverlay').classList.add('hidden');
  renderAll(data);
}

function renderAll(d) {
  renderStats(d);
  renderTrendChart(d);
  renderThemeChart(d);
  renderTopPapers(d);
  renderAuthors(d);
  renderWordCloud(d);
  renderJournalChart(d);
  renderThemeGrid(d);
  renderLatestPapers(d);

  document.getElementById('updateTime').textContent = '更新时间: ' + (d.updated_at || '—');
  document.getElementById('footerDate').textContent = d.updated_at || '—';
}

// ===== 1. Stats =====
function renderStats(d) {
  const stats = [
    { icon: '📄', value: fmtNum(d.total_papers), label: '论文总数' },
    { icon: '📊', value: fmtNum(d.total_citations), label: '总被引次数' },
    { icon: '👨‍🔬', value: '1,001+', label: '活跃研究者' },
    { icon: '🏛️', value: d.year_range || '—', label: '覆盖年份' },
  ];
  document.getElementById('statsRow').innerHTML = stats.map(s =>
    `<div class="stat-card"><div class="stat-icon">${s.icon}</div><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>`
  ).join('');
}

// ===== 2. Trend Chart =====
function renderTrendChart(d) {
  const chart = echarts.init(document.getElementById('trendChart'));
  const years = d.year_distribution || [];
  const labels = years.map(y => y.year);
  const counts = years.map(y => y.count);
  let cumulative = 0;
  const cumData = years.map(y => { cumulative += y.count; return cumulative; });

  chart.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' }, backgroundColor: '#111d38', borderColor: '#1a2d52' },
    legend: { data: ['年度发文', '累计发文'], textStyle: { color: CHART_TEXT }, bottom: 0 },
    grid: { left: 50, right: 50, top: 20, bottom: 40 },
    xAxis: { type: 'category', data: labels, axisLine: { lineStyle: { color: CHART_AXIS } }, axisLabel: { color: CHART_TEXT } },
    yAxis: [
      { type: 'value', name: '论文数', nameTextStyle: { color: CHART_TEXT }, axisLine: { show: false }, splitLine: { lineStyle: { color: CHART_AXIS } } },
      { type: 'value', name: '累计', nameTextStyle: { color: CHART_TEXT }, axisLine: { show: false }, splitLine: { show: false } }
    ],
    series: [
      { name: '年度发文', type: 'bar', data: counts, itemStyle: { color: '#3b82f6', borderRadius: [4,4,0,0] }, barMaxWidth: 30 },
      { name: '累计发文', type: 'line', yAxisIndex: 1, data: cumData, smooth: true, lineStyle: { color: '#22d3ee', width: 2 }, areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1, [{offset:0,color:'rgba(34,211,238,0.2)'},{offset:1,color:'rgba(34,211,238,0)'}]) }, symbol: 'circle', symbolSize: 6 }
    ]
  });
  window.addEventListener('resize', () => chart.resize());
}

// ===== 3. Theme Pie Chart =====
function renderThemeChart(d) {
  const chart = echarts.init(document.getElementById('themeChart'));
  const themes = d.theme_clusters || [];
  const data = themes.slice(0, 10).map((t, i) => ({
    name: t.theme.length > 10 ? t.theme.slice(0, 10) + '…' : t.theme,
    value: t.count,
    itemStyle: { color: CHART_COLORS[i % CHART_COLORS.length] }
  }));

  chart.setOption({
    tooltip: { trigger: 'item', formatter: '{b}: {c} 篇 ({d}%)', backgroundColor: '#111d38', borderColor: '#1a2d52' },
    series: [{
      type: 'pie', radius: ['40%', '70%'], center: ['50%', '50%'],
      data: data, label: { color: CHART_TEXT, fontSize: 11 },
      labelLine: { lineStyle: { color: CHART_AXIS } },
      emphasis: { label: { fontSize: 13, fontWeight: 'bold' }, itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.3)' } }
    }]
  });
  window.addEventListener('resize', () => chart.resize());
}

// ===== 4. Top 10 Papers Table =====
function renderTopPapers(d) {
  const papers = d.top10_papers || [];
  const body = document.getElementById('topPapersBody');
  body.innerHTML = papers.map(p => {
    const rankClass = p.rank <= 3 ? `rank-${p.rank}` : '';
    const rankEmoji = p.rank === 1 ? '🥇' : p.rank === 2 ? '🥈' : p.rank === 3 ? '🥉' : '';
    const firstAuthor = p.authors && p.authors.length > 0 ? p.authors[0] : '—';
    return `<tr>
      <td class="rank-cell ${rankClass}">${rankEmoji || p.rank}</td>
      <td style="max-width:400px">${esc(p.title)}</td>
      <td class="author-cell">${esc(firstAuthor)}</td>
      <td>${p.year || '—'}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.journal || '')}</td>
      <td><span class="cite-badge">${fmtNum(p.cited_by_count)}</span></td>
    </tr>`;
  }).join('');
}

// ===== 5. Authors =====
function renderAuthors(d) {
  // By citation
  const citeAuthors = d.top10_authors_by_citation || [];
  document.getElementById('authorByCitation').innerHTML = citeAuthors.map((a, i) =>
    `<div class="author-item"><span class="author-name">${i+1}. ${esc(a.name)}</span><span class="author-stat">${fmtNum(a.citations)} 引 / ${a.papers} 篇</span></div>`
  ).join('');

  // By count
  const countAuthors = d.top10_authors_by_paper_count || [];
  document.getElementById('authorByCount').innerHTML = countAuthors.map((a, i) =>
    `<div class="author-item"><span class="author-name">${i+1}. ${esc(a.name)}</span><span class="author-stat">${a.papers} 篇 / ${fmtNum(a.citations)} 引</span></div>`
  ).join('');
}

// ===== 6. Word Cloud =====
function renderWordCloud(d) {
  try {
    const chart = echarts.init(document.getElementById('wordcloudChart'));
    const keywords = (d.top30_keywords || []).slice(0, 25);
    const topCount = keywords.length > 0 ? keywords[0].count : 1;
    const data = keywords.map((k, i) => ({
      name: k.keyword, value: Math.max(k.count, 1),
      textStyle: { color: CHART_COLORS[i % CHART_COLORS.length], fontSize: Math.max(14, 12 + (k.count / topCount) * 28) }
    }));
    chart.setOption({
      title: { show: false },
      series: [{ type: 'wordCloud', shape: 'circle', left: 'center', top: 'center', width: '90%', height: '90%', sizeRange: [14, 36], rotationRange: [-30, 30], rotationStep: 30, gridSize: 6, drawOutOfBound: false, layoutAnimation: true, textStyle: { fontFamily: '-apple-system, "PingFang SC", sans-serif', fontWeight: '500' }, data: data, emphasis: { textStyle: { color: '#22d3ee', fontWeight: '700' } } }]
    });
    window.addEventListener('resize', () => chart.resize());
  } catch(e) {
    document.getElementById('wordcloudChart').parentElement.innerHTML = '<div style="text-align:center;padding:80px 0;color:#6b8cbe">⚠️ 词云渲染不可用<br><span style="font-size:12px">(需要echarts-wordcloud插件)</span></div>';
  }
}

// ===== 7. Journal Chart =====
function renderJournalChart(d) {
  const chart = echarts.init(document.getElementById('journalChart'));
  const journals = (d.top20_journals || []).slice(0, 15).reverse();
  const names = journals.map(j => j.journal.length > 25 ? j.journal.slice(0, 24) + '…' : j.journal);
  const counts = journals.map(j => j.count);

  chart.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: '#111d38', borderColor: '#1a2d52' },
    grid: { left: 120, right: 40, top: 10, bottom: 20 },
    xAxis: { type: 'value', axisLine: { show: false }, splitLine: { lineStyle: { color: CHART_AXIS } }, axisLabel: { color: CHART_TEXT } },
    yAxis: { type: 'category', data: names, axisLine: { show: false }, axisLabel: { color: CHART_TEXT, fontSize: 11 } },
    series: [{
      type: 'bar', data: counts.map((v, i) => ({ value: v, itemStyle: { color: CHART_COLORS[i % CHART_COLORS.length] } })),
      barMaxWidth: 20, label: { show: true, position: 'right', color: CHART_TEXT, fontSize: 11 }
    }]
  });
  window.addEventListener('resize', () => chart.resize());
}

// ===== 8. Theme Grid =====
function renderThemeGrid(d) {
  const themes = d.theme_clusters || [];
  const maxCount = themes.length > 0 ? themes[0].count : 1;
  const emojis = ['📡','🚁','🏙️','✈️','🗺️','📍','🔋','🔒','📦','🔊','🤖','📚','📋','🌾'];

  document.getElementById('themeGrid').innerHTML = themes.map((t, i) => {
    const pct = (t.count / maxCount * 100).toFixed(0);
    return `<div class="theme-card">
      <div class="theme-emoji">${emojis[i % emojis.length]}</div>
      <div class="theme-name">${esc(t.theme)}</div>
      <div class="theme-meta">${t.count} 篇论文 · ${fmtNum(t.total_citations)} 次被引</div>
      <div class="theme-bar"><div class="theme-bar-fill" style="width:${pct}%;background:${CHART_COLORS[i % CHART_COLORS.length]}"></div></div>
    </div>`;
  }).join('');
}

// ===== 9. Latest Papers =====
function renderLatestPapers(d) {
  const papers = d.latest_5_papers || [];
  document.getElementById('latestPapers').innerHTML = papers.map(p => {
    const authors = p.authors && p.authors.length > 0
      ? (p.authors.slice(0, 3).join(', ') + (p.authors.length > 3 ? ' et al.' : ''))
      : '—';
    const doiLink = p.doi ? `DOI: <a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">${esc(p.doi)}</a>` : '';
    return `<div class="paper-card">
      <div class="paper-title">${esc(p.title)}</div>
      <div class="paper-meta">
        <span>👤 ${esc(authors)}</span>
        <span>📅 ${p.year || '—'}</span>
        <span>📰 ${esc(p.journal || '')}</span>
        <span class="cite">📊 ${fmtNum(p.cited_by_count)} 次被引</span>
      </div>
      ${p.abstract ? `<div class="paper-abstract">${esc(p.abstract.slice(0, 200))}${p.abstract.length > 200 ? '…' : ''}</div>` : ''}
      <div class="paper-doi">${doiLink}</div>
    </div>`;
  }).join('');
}

// ===== Utilities =====
function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== Start =====
init();
</script>
