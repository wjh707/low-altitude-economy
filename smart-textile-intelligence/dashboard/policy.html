<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政策法规 - 智能纺织品情报系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="data_policy_data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; color: #333; }
        .navbar { background: linear-gradient(135deg, #1565C0, #00897B); padding: 0 30px; display: flex; align-items: center; height: 64px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar .brand { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 1px; margin-right: 40px; white-space: nowrap; }
        .navbar .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
        .navbar .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; transition: all .2s; }
        .navbar .nav-links a:hover, .navbar .nav-links a.active { background: rgba(255,255,255,0.18); color: #fff; }
        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
        .back-link { display: inline-block; margin-bottom: 16px; color: #1565C0; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        .page-title { font-size: 28px; color: #1565C0; margin-bottom: 6px; }
        .page-subtitle { font-size: 14px; color: #888; margin-bottom: 20px; }

        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
        .stat-card { background: #fff; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 3px solid #1565C0; }
        .stat-card .num { font-size: 26px; font-weight: 700; color: #1565C0; }
        .stat-card .label { font-size: 12px; color: #888; margin-top: 2px; }
        .stat-card:nth-child(2) { border-top-color: #00897B; }
        .stat-card:nth-child(2) .num { color: #00897B; }
        .stat-card:nth-child(3) { border-top-color: #e67e22; }
        .stat-card:nth-child(3) .num { color: #e67e22; }
        .stat-card:nth-child(4) { border-top-color: #8e44ad; }
        .stat-card:nth-child(4) .num { color: #8e44ad; }

        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .chart-box { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .chart-box h3 { font-size: 14px; color: #333; margin-bottom: 10px; padding-left: 8px; border-left: 3px solid #1565C0; }
        .chart-box .chart { width: 100%; height: 220px; }

        .filter-bar { background: #fff; border-radius: 10px; padding: 14px 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .filter-bar label { font-size: 13px; color: #666; font-weight: 500; }
        .filter-bar select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; color: #333; background: #fff; cursor: pointer; }
        .filter-bar select:focus { outline: none; border-color: #1565C0; }
        .filter-bar .count-info { margin-left: auto; font-size: 13px; color: #888; }

        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .dash-card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid #1565C0; transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column; }
        .dash-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .dash-card .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
        .dash-card .card-top h3 { font-size: 15px; color: #333; flex: 1; line-height: 1.5; }
        .dash-card .card-top .date { font-size: 12px; color: #999; white-space: nowrap; flex-shrink: 0; }
        .dash-card .card-body { flex: 1; }
        .dash-card .card-body .summary { font-size: 13px; color: #666; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .dash-card .card-footer { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; background: #e3f2fd; color: #1565C0; }
        .tag.green { background: #e0f2f1; color: #00897B; }
        .tag.orange { background: #fff3e0; color: #e67e22; }
        .tag.purple { background: #f3e5f5; color: #8e44ad; }
        .tag.red { background: #ffebee; color: #c62828; }
        .tag.teal { background: #e0f2f1; color: #00695c; }
        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .status-effective { background: #e8f5e9; color: #2e7d32; }
        .status-proposed { background: #fff8e1; color: #f57f17; }

        .pagination { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .pagination button { padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; background: #fff; color: #333; cursor: pointer; font-size: 13px; transition: all .2s; }
        .pagination button:hover { border-color: #1565C0; color: #1565C0; }
        .pagination button.active { background: #1565C0; color: #fff; border-color: #1565C0; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; border-top: 1px solid #eee; }
        .empty-msg { text-align: center; padding: 60px; color: #999; font-size: 16px; }
        .error-msg { text-align: center; padding: 40px; color: #c62828; background: #ffebee; border-radius: 12px; margin: 20px; }
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; height: auto; padding: 10px 16px; }
            .navbar .brand { margin-bottom: 6px; font-size: 16px; }
            .navbar .nav-links a { padding: 6px 12px; font-size: 13px; }
            .page-title { font-size: 22px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .chart-row { grid-template-columns: 1fr; }
            .dash-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="brand">🧵 智能纺织品情报系统</div>
    <div class="nav-links">
        <a href="index.html">🏠 首页总览</a>
        <a href="market.html">🌍 市场动态</a>
        <a href="policy.html" class="active">📜 政策法规</a>
        <a href="tech.html">🔬 技术前沿</a>
        <a href="research.html">🎓 科研动态</a>
        <a href="standards.html">📋 行规标准</a>
    </div>
</nav>
<div class="container">
    <a href="index.html" class="back-link">← 返回总览</a>
    <h1 class="page-title">📜 政策法规</h1>
    <p class="page-subtitle">汇集各国智能纺织品相关产业规划、科研支持、标准制定与资金补贴政策</p>

    <div class="stats-row" id="statsRow"></div>
    <div class="chart-row">
        <div class="chart-box"><h3>类型分布</h3><div id="typeChart" class="chart"></div></div>
        <div class="chart-box"><h3>国家分布</h3><div id="countryChart" class="chart"></div></div>
    </div>

    <div class="filter-bar">
        <label>国家/地区：</label>
        <select id="countryFilter" onchange="applyFilter()">
            <option value="all">全部</option>
        </select>
        <label>类型：</label>
        <select id="typeFilter" onchange="applyFilter()">
            <option value="all">全部</option>
        </select>
        <span class="count-info" id="countInfo">共 0 条</span>
    </div>

    <div class="dash-grid" id="dashGrid">
        <div class="empty-msg" style="grid-column:1/-1;">加载中...</div>
    </div>

    <div class="pagination" id="pagination"></div>
</div>
<div class="footer">数据更新时间：<span id="updateDate">--</span> | 智能纺织品情报系统 · 仅供内部参考</div>

<script>
(function() {
    var typeMap = {
        'industry_policy': '产业政策',
        'environmental_regulation': '环境法规',
        'safety_standard': '安全标准',
        'technical_standard': '技术标准',
        'subsidy_funding': '补贴资金'
    };
    var typeColors = {
        'industry_policy': '#1565C0',
        'environmental_regulation': '#00897B',
        'safety_standard': '#e67e22',
        'technical_standard': '#8e44ad',
        'subsidy_funding': '#27ae60'
    };
    var statusMap = {
        'effective': '已实施',
        'proposed': '草案'
    };

    var allRecords = [];
    var currentPage = 1;
    var pageSize = 10;
    var typeChart = null;
    var countryChart = null;

    function init() {
        var data = window.POLICY_DATA;
        if (!data || !data.records) {
            document.getElementById('dashGrid').innerHTML = '<div class="error-msg" style="grid-column:1/-1;">❌ 数据加载失败</div>';
            return;
        }

        allRecords = data.records.slice().sort(function(a, b) {
            return (b.date || '').localeCompare(a.date || '');
        });

        // Populate filters
        var countries = new Set(); allRecords.forEach(function(r) { if (r.country) countries.add(r.country); });
        var types = new Set(); allRecords.forEach(function(r) { if (r.type) types.add(r.type); });

        var sel1 = document.getElementById('countryFilter');
        Array.from(countries).sort().forEach(function(v) {
            var o = document.createElement('option'); o.value = v; o.textContent = v; sel1.appendChild(o);
        });
        var sel2 = document.getElementById('typeFilter');
        Array.from(types).sort().forEach(function(v) {
            var o = document.createElement('option'); o.value = v; o.textContent = typeMap[v] || v; sel2.appendChild(o);
        });

        window.applyFilter = function() { currentPage = 1; render(); };
        render();
        document.getElementById('updateDate').textContent = new Date().toISOString().slice(0, 10);
    }

    function renderStats(filtered) {
        var total = filtered.length;
        var countries = new Set(); filtered.forEach(function(r) { if (r.country) countries.add(r.country); });
        var recent = filtered.filter(function(r) { return r.date && r.date >= '2026-01-01'; }).length;
        var active = filtered.filter(function(r) { return r.status === 'effective'; }).length;

        document.getElementById('statsRow').innerHTML =
            '<div class="stat-card"><div class="num">' + total + '</div><div class="label">政策总数</div></div>' +
            '<div class="stat-card"><div class="num">' + countries.size + '</div><div class="label">覆盖国家</div></div>' +
            '<div class="stat-card"><div class="num">' + recent + '</div><div class="label">2026年政策</div></div>' +
            '<div class="stat-card"><div class="num">' + active + '</div><div class="label">已实施</div></div>';
    }

    function renderCharts(filtered) {
        // Type pie
        var typeCount = {};
        filtered.forEach(function(r) { var t = r.type || 'other'; typeCount[t] = (typeCount[t] || 0) + 1; });
        var pieData = Object.keys(typeCount).map(function(t) {
            return { name: typeMap[t] || t, value: typeCount[t], itemStyle: { color: typeColors[t] || '#999' } };
        });
        if (typeChart) typeChart.dispose();
        typeChart = echarts.init(document.getElementById('typeChart'));
        typeChart.setOption({
            tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
            series: [{
                type: 'pie', radius: ['40%', '65%'], center: ['50%', '50%'],
                data: pieData.length ? pieData : [{ name: '无数据', value: 1, itemStyle: { color: '#eee' } }],
                label: { fontSize: 11 },
                itemStyle: { borderRadius: 4, borderColor: '#fff', borderWidth: 2 },
                emphasis: { itemStyle: { shadowBlur: 8, shadowColor: 'rgba(0,0,0,0.15)' } }
            }]
        });

        // Country bar
        var countryCount = {};
        filtered.forEach(function(r) { var c = r.country || '未知'; countryCount[c] = (countryCount[c] || 0) + 1; });
        var names = Object.keys(countryCount).sort(function(a, b) { return countryCount[b] - countryCount[a]; });
        var vals = names.map(function(k) { return countryCount[k]; });

        if (countryChart) countryChart.dispose();
        countryChart = echarts.init(document.getElementById('countryChart'));
        countryChart.setOption({
            tooltip: { trigger: 'axis' },
            grid: { left: '12%', right: '6%', bottom: '10%', top: '6%', containLabel: true },
            xAxis: { type: 'category', data: names, axisLabel: { fontSize: 10, rotate: 20 } },
            yAxis: { type: 'value', name: '数量' },
            series: [{ type: 'bar', data: vals, itemStyle: { color: '#00897B', borderRadius: [4,4,0,0] }, barMaxWidth: 36 }]
        });

        window.addEventListener('resize', function() {
            if (typeChart) typeChart.resize(); if (countryChart) countryChart.resize();
        });
    }

    function render() {
        var countryVal = document.getElementById('countryFilter').value;
        var typeVal = document.getElementById('typeFilter').value;

        var filtered = allRecords;
        if (countryVal !== 'all') filtered = filtered.filter(function(r) { return r.country === countryVal; });
        if (typeVal !== 'all') filtered = filtered.filter(function(r) { return r.type === typeVal; });

        document.getElementById('countInfo').textContent = '共 ' + filtered.length + ' 条';
        renderStats(filtered);
        renderCharts(filtered);

        var totalPages = Math.ceil(filtered.length / pageSize) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        var start = (currentPage - 1) * pageSize;
        var pageItems = filtered.slice(start, start + pageSize);

        var grid = document.getElementById('dashGrid');
        if (pageItems.length === 0) {
            grid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;">暂无数据</div>';
            renderPagination(totalPages); return;
        }

        var html = '';
        pageItems.forEach(function(r) {
            var statusLabel = statusMap[r.status] || r.status || '--';
            var statusClass = r.status === 'effective' ? 'status-effective' : 'status-proposed';
            html += '<div class="dash-card">';
            html += '<div class="card-top">';
            html += '<h3>' + (r.title || '') + '</h3>';
            html += '<span class="date">' + (r.date || '') + '</span>';
            html += '</div>';
            html += '<div class="card-body">';
            if (r.summary) html += '<div class="summary">' + r.summary + '</div>';
            html += '</div>';
            html += '<div class="card-footer">';
            if (r.country) html += '<span class="tag">' + r.country + '</span>';
            if (r.type) html += '<span class="tag orange">' + (typeMap[r.type] || r.type) + '</span>';
            if (r.source) html += '<span class="tag teal">' + r.source + '</span>';
            html += '<span class="status-badge ' + statusClass + '">' + statusLabel + '</span>';
            html += '</div>';
            html += '</div>';
        });
        grid.innerHTML = html;
        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        var pg = document.getElementById('pagination');
        if (totalPages <= 1) { pg.innerHTML = ''; return; }
        var html = '';
        html += '<button onclick="goPage(1)" ' + (currentPage <= 1 ? 'disabled' : '') + '>«</button>';
        html += '<button onclick="goPage(' + (currentPage - 1) + ')" ' + (currentPage <= 1 ? 'disabled' : '') + '>‹</button>';
        var startP = Math.max(1, currentPage - 2);
        var endP = Math.min(totalPages, startP + 4);
        for (var i = startP; i <= endP; i++) {
            html += '<button onclick="goPage(' + i + ')" class="' + (i === currentPage ? 'active' : '') + '">' + i + '</button>';
        }
        html += '<button onclick="goPage(' + (currentPage + 1) + ')" ' + (currentPage >= totalPages ? 'disabled' : '') + '>›</button>';
        html += '<button onclick="goPage(' + totalPages + ')" ' + (currentPage >= totalPages ? 'disabled' : '') + '>»</button>';
        pg.innerHTML = html;
    }

    window.goPage = function(p) {
        var countryVal = document.getElementById('countryFilter').value;
        var typeVal = document.getElementById('typeFilter').value;
        var filtered = allRecords;
        if (countryVal !== 'all') filtered = filtered.filter(function(r) { return r.country === countryVal; });
        if (typeVal !== 'all') filtered = filtered.filter(function(r) { return r.type === typeVal; });
        var totalPages = Math.ceil(filtered.length / pageSize) || 1;
        if (p < 1 || p > totalPages) return;
        currentPage = p;
        render();
    };

    if (typeof window.POLICY_DATA !== 'undefined') { init(); }
    else {
        var ci = setInterval(function() {
            if (typeof window.POLICY_DATA !== 'undefined') { clearInterval(ci); init(); }
        }, 100);
        setTimeout(function() { clearInterval(ci); }, 5000);
    }
})();
</script>
</body>
</html>
