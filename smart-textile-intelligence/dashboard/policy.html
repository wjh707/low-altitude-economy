<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能纺织品情报洞察系统 - 宏观环境与政策</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="data_policy.js"></script>
    <script src="data_summary.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .navbar { background: linear-gradient(135deg, #1565C0, #00897B); padding: 0 30px; display: flex; align-items: center; height: 64px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar .brand { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 1px; margin-right: 40px; white-space: nowrap; }
        .navbar .nav-links { display: flex; gap: 6px; }
        .navbar .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; transition: all .2s; }
        .navbar .nav-links a:hover, .navbar .nav-links a.active { background: rgba(255,255,255,0.18); color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: #fff; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 3px solid #1565C0; transition: transform .2s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(21,101,192,0.12); }
        .stat-card .num { font-size: 32px; font-weight: 700; color: #1565C0; }
        .stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }
        .stat-card:nth-child(2) { border-top-color: #e67e22; }
        .stat-card:nth-child(2) .num { color: #e67e22; }
        .stat-card:nth-child(3) { border-top-color: #27ae60; }
        .stat-card:nth-child(3) .num { color: #27ae60; }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .chart-box { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .chart-box h3 { font-size: 16px; color: #333; margin-bottom: 12px; padding-left: 10px; border-left: 3px solid #1565C0; }
        .chart-box .chart { width: 100%; height: 320px; }
        .list-section { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .list-section h3 { font-size: 16px; margin-bottom: 12px; padding-left: 10px; border-left: 3px solid #1565C0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .list-section h3 select { padding: 4px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
        .list-table { width: 100%; border-collapse: collapse; }
        .list-table th { background: #f0f4ff; text-align: left; padding: 10px 12px; font-size: 13px; color: #555; border-bottom: 2px solid #e0e8f0; }
        .list-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
        .list-table tr:hover { background: #f8faff; }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; background: #e3f2fd; color: #1565C0; margin-right: 4px; }
        .tag.national { background: #ffebee; color: #c62828; }
        .tag.provincial { background: #fff3e0; color: #e67e22; }
        .tag.international { background: #e8f5e9; color: #2e7d32; }
        .tag.cat { background: #f3e5f5; color: #8e44ad; }
        .loading { text-align: center; padding: 80px; font-size: 18px; color: #999; }
        .error-msg { text-align: center; padding: 40px; color: #c62828; background: #ffebee; border-radius: 12px; margin: 20px; }
        .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; }
        @media (max-width: 900px) {
            .stats-row { grid-template-columns: repeat(2,1fr); }
            .chart-row { grid-template-columns: 1fr; }
            .navbar { flex-wrap: wrap; height: auto; padding: 10px 16px; }
            .navbar .brand { margin-bottom: 6px; }
            .navbar .nav-links { flex-wrap: wrap; }
        }
        @media (max-width: 600px) {
            .stats-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="brand">🧵 智能纺织品情报洞察系统</div>
    <div class="nav-links">
        <a href="index.html">📊 技术监测</a>
        <a href="policy.html" class="active">🌐 宏观环境与政策</a>
        <a href="competition.html">🏭 产业与市场</a>
        <a href="radar.html">🔬 技术创新</a>
        <a href="standards.html">📋 标准与合规</a>
    </div>
</nav>
<div class="container" id="appContainer">
    <div class="loading" id="loadingIndicator">加载中...</div>
</div>
<div class="footer">数据更新时间：2026-05-07 08:00 | 数据来源：智能纺织品情报系统 · 仅供内部参考</div>
<script>
(function(){
    var container = document.getElementById('appContainer');

    function initPage(){
        if(typeof window.POLICY_DATA === 'undefined'){
            container.innerHTML = '<div class="error-msg">❌ 数据加载失败，请确认 data_policy.js 已正确加载。</div>';
            return;
        }

        var policies = window.POLICY_DATA.records;
        var total = policies.length;
        var nationalCount = policies.filter(function(p){ return p.level === 'national'; }).length;
        var yearNew = policies.filter(function(p){ return p.date >= '2026-01-01'; }).length;

        // Category distribution
        var catCount = {};
        policies.forEach(function(p){
            if(!catCount[p.category]) catCount[p.category] = 0;
            catCount[p.category]++;
        });

        // Region/level distribution
        var regionCount = {};
        policies.forEach(function(p){
            // Use source country/region as region
            var region = p.source.replace(/[（(].*?[）)]/g, '').trim().substring(0,4);
            if(p.source.indexOf('工信部') !== -1 || p.source.indexOf('经信厅') !== -1 || p.source.indexOf('基金委') !== -1 || p.source.indexOf('纺织工业') !== -1 || p.source.indexOf('深圳') !== -1 || p.source.indexOf('浙江') !== -1) region = '中国';
            else if(p.source.indexOf('欧盟') !== -1 || p.source.indexOf('德国') !== -1) region = '欧洲';
            else if(p.source.indexOf('美国') !== -1) region = '美国';
            else if(p.source.indexOf('日本') !== -1) region = '日本';
            else if(p.source.indexOf('韩国') !== -1) region = '韩国';
            else if(p.source.indexOf('中日韩') !== -1) region = '国际';
            if(!regionCount[region]) regionCount[region] = 0;
            regionCount[region]++;
        });

        var categoryMap = {
            '产业规划': '产业规划',
            '资金补贴': '资金补贴',
            '税收优惠': '税收优惠',
            '国际贸易': '国际贸易',
            '科研支持': '科研支持',
            '标准制定': '标准制定'
        };

        var levelNameMap = { 'national': '国家级', 'provincial': '省级', 'international': '国际级' };
        var levelColors = { 'national': 'national', 'provincial': 'provincial', 'international': 'international' };

        // Build HTML
        var html = '';
        // Stats
        html += '<div class="stats-row">';
        html += '<div class="stat-card"><div class="num">'+total+'</div><div class="label">政策总数</div></div>';
        html += '<div class="stat-card"><div class="num">'+nationalCount+'</div><div class="label">国家级数量</div></div>';
        html += '<div class="stat-card"><div class="num">'+yearNew+'</div><div class="label">年度新增(2026)</div></div>';
        html += '</div>';

        // Charts
        html += '<div class="chart-row">';
        html += '<div class="chart-box"><h3>政策类别分布</h3><div id="catPie" class="chart"></div></div>';
        html += '<div class="chart-box"><h3>地区分布</h3><div id="regionBar" class="chart"></div></div>';
        html += '</div>';

        // Filters
        var levelOptions = '<option value="all">全部级别</option>';
        Object.keys(levelNameMap).forEach(function(k){ levelOptions += '<option value="'+k+'">'+levelNameMap[k]+'</option>'; });
        var catOptions = '<option value="all">全部类别</option>';
        Object.keys(categoryMap).forEach(function(k){ catOptions += '<option value="'+k+'">'+k+'</option>'; });

        html += '<div class="list-section">';
        html += '<h3>📋 政策时间线 <select id="levelFilter" onchange="filterPolicies()">'+levelOptions+'</select><select id="catFilter" onchange="filterPolicies()">'+catOptions+'</select></h3>';
        html += '<table class="list-table"><thead><tr><th>标题</th><th>日期</th><th>来源</th><th>级别</th><th>类别</th></tr></thead><tbody id="policyList"></tbody></table>';
        html += '</div>';

        container.innerHTML = html;

        // Category pie
        var catPieData = Object.keys(catCount).map(function(k){ return { name: k, value: catCount[k] }; });
        var catPie = echarts.init(document.getElementById('catPie'));
        catPie.setOption({
            tooltip: { trigger:'item', formatter:'{b}: {c} ({d}%)' },
            series: [{
                type:'pie', radius:['35%','60%'], center:['50%','50%'],
                data: catPieData,
                label: { fontSize: 11 },
                itemStyle: { borderRadius: 6, borderColor:'#fff', borderWidth: 2 },
                color: ['#1565C0','#00897B','#e67e22','#8e44ad','#27ae60','#c62828'],
                emphasis: { itemStyle: { shadowBlur:10, shadowColor:'rgba(0,0,0,0.2)' } }
            }]
        });

        // Region bar
        var regionNames = Object.keys(regionCount).sort();
        var regionVals = regionNames.map(function(r){ return regionCount[r]; });
        var regionBar = echarts.init(document.getElementById('regionBar'));
        regionBar.setOption({
            tooltip: { trigger:'axis' },
            grid: { left:'10%', right:'6%', bottom:'15%', top:'8%', containLabel:true },
            xAxis: { type:'category', data: regionNames, axisLabel: { fontSize: 11 } },
            yAxis: { type:'value', name:'政策数量' },
            series: [{
                type:'bar', data: regionVals,
                itemStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#e67e22'},{offset:1,color:'#f5b041'}]), borderRadius:[5,5,0,0] },
                barWidth:'50%',
                label: { show:true, position:'top', fontSize: 11 }
            }]
        });

        window.addEventListener('resize', function(){ catPie.resize(); regionBar.resize(); });

        // Filter
        window.filterPolicies = function(){
            var lf = document.getElementById('levelFilter').value;
            var cf = document.getElementById('catFilter').value;
            var tbody = document.getElementById('policyList');
            tbody.innerHTML = '';
            var filtered = policies.filter(function(p){
                return (lf === 'all' || p.level === lf) && (cf === 'all' || p.category === cf);
            });
            filtered.sort(function(a,b){ return b.date.localeCompare(a.date); });
            filtered.forEach(function(p){
                var tr = document.createElement('tr');
                var levelLabel = levelNameMap[p.level] || p.level;
                tr.innerHTML = '<td>'+p.title+'</td><td>'+p.date+'</td><td>'+p.source+'</td><td><span class="tag '+levelColors[p.level]+'">'+levelLabel+'</span></td><td><span class="tag cat">'+p.category+'</span></td>';
                tbody.appendChild(tr);
            });
        };
        window.filterPolicies();
    }

    if(typeof window.POLICY_DATA !== 'undefined'){
        initPage();
    } else {
        var ci = setInterval(function(){
            if(typeof window.POLICY_DATA !== 'undefined'){
                clearInterval(ci);
                initPage();
            }
        }, 100);
        setTimeout(function(){ clearInterval(ci);
            if(document.getElementById('loadingIndicator')){
                container.innerHTML = '<div class="error-msg">❌ 数据加载超时，请刷新页面重试。</div>';
            }
        }, 5000);
    }
})();
</script>
</body>
</html>
