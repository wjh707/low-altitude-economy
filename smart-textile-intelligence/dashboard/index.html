<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能纺织品情报洞察系统 - 综合情报总览</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="data_summary.js"></script>
    <script src="data_smart_textile_data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .navbar { background: linear-gradient(135deg, #1565C0, #00897B); padding: 0 30px; display: flex; align-items: center; height: 64px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar .brand { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 1px; margin-right: 40px; white-space: nowrap; }
        .navbar .nav-links { display: flex; gap: 6px; }
        .navbar .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; transition: all .2s; }
        .navbar .nav-links a:hover, .navbar .nav-links a.active { background: rgba(255,255,255,0.18); color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .stats-row { display: grid; grid-template-columns: repeat(5,1fr); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: #fff; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 3px solid #1565C0; transition: transform .2s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(21,101,192,0.12); }
        .stat-card .num { font-size: 32px; font-weight: 700; color: #1565C0; }
        .stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }
        .stat-card:nth-child(2) { border-top-color: #00897B; }
        .stat-card:nth-child(2) .num { color: #00897B; }
        .stat-card:nth-child(3) { border-top-color: #e67e22; }
        .stat-card:nth-child(3) .num { color: #e67e22; }
        .stat-card:nth-child(4) { border-top-color: #8e44ad; }
        .stat-card:nth-child(4) .num { color: #8e44ad; }
        .stat-card:nth-child(5) { border-top-color: #27ae60; }
        .stat-card:nth-child(5) .num { color: #27ae60; }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .chart-box { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .chart-box h3 { font-size: 16px; color: #333; margin-bottom: 12px; padding-left: 10px; border-left: 3px solid #1565C0; }
        .chart-full { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .chart-full h3 { font-size: 16px; color: #333; margin-bottom: 12px; padding-left: 10px; border-left: 3px solid #00897B; }
        .list-section { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .list-section h3 { font-size: 16px; margin-bottom: 12px; padding-left: 10px; border-left: 3px solid #1565C0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .list-section h3 select { padding: 4px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
        .list-table { width: 100%; border-collapse: collapse; }
        .list-table th { background: #f0f4ff; text-align: left; padding: 10px 12px; font-size: 13px; color: #555; border-bottom: 2px solid #e0e8f0; }
        .list-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
        .list-table tr:hover { background: #f8faff; }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; background: #e3f2fd; color: #1565C0; margin-right: 4px; }
        .tag.blue { background: #e3f2fd; color: #1565C0; }
        .tag.green { background: #e0f2f1; color: #00897B; }
        .tag.orange { background: #fff3e0; color: #e67e22; }
        .tag.purple { background: #f3e5f5; color: #8e44ad; }
        .tag.red { background: #ffebee; color: #c62828; }
        .tag.active { background: #e8f5e9; color: #2e7d32; }
        .tag.ultra { background: #fce4ec; color: #c2185b; }
        .tag.passive { background: #f5f5f5; color: #757575; }
        .loading { text-align: center; padding: 80px; font-size: 18px; color: #999; }
        .error-msg { text-align: center; padding: 40px; color: #c62828; background: #ffebee; border-radius: 12px; margin: 20px; }
        .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; }
        .chart-box .chart, .chart-full .chart { width: 100%; height: 320px; }
        .chart-box .chart { height: 300px; }
        .tech-card { border-left: 4px solid #1565C0; transition: all .2s; }
        .tech-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(21,101,192,0.15); }
        .tech-card.active { border-left-color: #00897B; background: #f0faf8; }
        @media (max-width: 900px) {
            .stats-row { grid-template-columns: repeat(3,1fr); }
            .chart-row { grid-template-columns: 1fr; }
            .navbar { flex-wrap: wrap; height: auto; padding: 10px 16px; }
            .navbar .brand { margin-bottom: 6px; }
            .navbar .nav-links { flex-wrap: wrap; }
            #radarCards { grid-template-columns: repeat(2,1fr) !important; }
        }
        @media (max-width: 600px) {
            .stats-row { grid-template-columns: repeat(2,1fr); }
            #radarCards { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="brand">🧵 智能纺织品情报洞察系统</div>
    <div class="nav-links">
        <a href="index.html" class="active">📊 综合情报总览</a>
        <a href="policy.html">🌐 宏观环境与政策</a>
        <a href="competition.html">🏭 产业与市场</a>
        <a href="standards.html">📋 标准与合规</a>
    </div>
</nav>
<div class="container" id="appContainer">
    <div class="loading" id="loadingIndicator">加载中...</div>
</div>
<div class="footer">数据更新时间：2026-05-07 08:00 | 数据来源：智能纺织品情报系统 · 仅供内部参考</div>
<script>
(function(){
    var container = document.getElementById('appContainer');

    function initPage(){
        if(typeof window.SMART_TEXTILE_DATA === 'undefined' || typeof window.DASHBOARD_SUMMARY === 'undefined'){
            container.innerHTML = '<div class="error-msg">❌ 数据加载失败，请确认 data_smart_textile_data.js 和 data_summary.js 已正确加载。</div>';
            return;
        }

        var records = window.SMART_TEXTILE_DATA.records;
        var summary = window.DASHBOARD_SUMMARY;

        // Tech name mapping
        var techNameMap = {
            'conductive-fiber': '导电纤维',
            'flexible-sensor': '柔性传感器',
            'energy-harvesting': '能量采集',
            'embedded-circuit': '嵌入式电路',
            'communication': '通信模块',
            'integration': '纺织-电子集成工艺'
        };
        var sceneNameMap = {
            'healthcare': '医疗健康',
            'sports-fitness': '运动健身',
            'military-defense': '军事国防',
            'smart-home': '智能家居',
            'fashion-entertainment': '时尚娱乐',
            'industrial-safety': '工业安全',
            'wearable-computing': '可穿戴计算'
        };
        var eventTypeMap = {
            'technology_breakthrough': '技术突破',
            'corporate_cooperation': '企业合作',
            'policy': '政策',
            'funding': '资金',
            'product_launch': '产品发布',
            'standards': '标准'
        };
        var smartLevelMap = {
            'passive': '被动型',
            'active': '主动型',
            'ultra': '超智能型'
        };

        // Statistics from records
        var total = records.length;
        var techSet = new Set(); records.forEach(function(r){ r.tech_tags.forEach(function(t){ techSet.add(t); }); });
        var techCount = techSet.size;
        var sceneSet = new Set(); records.forEach(function(r){ r.scene_tags.forEach(function(s){ sceneSet.add(s); }); });
        var sceneCount = sceneSet.size;
        var companySet = new Set(); records.forEach(function(r){ companySet.add(r.source); });
        var companyCount = companySet.size;
        var now = new Date('2026-05-07');
        var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        var monthNew = records.filter(function(r){ return new Date(r.date) >= monthStart; }).length;

        // Month aggregation
        var monthAgg = {};
        records.forEach(function(r){
            var m = r.date.substring(0,7);
            if(!monthAgg[m]) monthAgg[m] = 0;
            monthAgg[m]++;
        });
        var months = Object.keys(monthAgg).sort();
        var monthValues = months.map(function(m){ return monthAgg[m]; });

        // Event type pie
        var typeCount = {};
        records.forEach(function(r){
            if(!typeCount[r.event_type]) typeCount[r.event_type] = 0;
            typeCount[r.event_type]++;
        });

        // Tech × Scene heatmap
        var techs = Object.keys(techNameMap);
        var scenes = Object.keys(sceneNameMap);
        var heatData = [];
        techs.forEach(function(t, ti){
            scenes.forEach(function(s, si){
                var count = records.filter(function(r){
                    return r.tech_tags.indexOf(t) !== -1 && r.scene_tags.indexOf(s) !== -1;
                }).length;
                heatData.push([si, ti, count]);
            });
        });

        var allRegions = ['中国','美国','日本','韩国','欧洲','加拿大'];
        var eventColors = {technology_breakthrough:'#1565C0', corporate_cooperation:'#00897B', policy:'#e67e22', funding:'#8e44ad', product_launch:'#27ae60', standards:'#c62828'};
        var eventTypeColors = {technology_breakthrough:'blue', corporate_cooperation:'green', policy:'orange', funding:'purple', product_launch:'red', standards:'blue'};

        // Build HTML
        var html = '';
        // Stats row
        html += '<div class="stats-row">';
        html += '<div class="stat-card"><div class="num">'+total+'</div><div class="label">数据总量</div></div>';
        html += '<div class="stat-card"><div class="num">'+techCount+'</div><div class="label">技术方向数</div></div>';
        html += '<div class="stat-card"><div class="num">'+sceneCount+'</div><div class="label">覆盖场景数</div></div>';
        html += '<div class="stat-card"><div class="num">'+companyCount+'</div><div class="label">覆盖企业数</div></div>';
        html += '<div class="stat-card"><div class="num">'+monthNew+'</div><div class="label">本月新增</div></div>';
        html += '</div>';

        // First row charts
        html += '<div class="chart-row">';
        html += '<div class="chart-box"><h3>按月情报时间分布</h3><div id="monthChart" class="chart"></div></div>';
        html += '<div class="chart-box"><h3>事件类型分布</h3><div id="typePie" class="chart"></div></div>';
        html += '</div>';

        // Second row heatmap
        html += '<div class="chart-full"><h3>技术×场景交叉热力图</h3><div id="heatChart" class="chart"></div></div>';

        // Event list
        var eventFilterOptions = '<option value="all">全部类型</option>';
        Object.keys(eventTypeMap).forEach(function(k){ eventFilterOptions += '<option value="'+k+'">'+eventTypeMap[k]+'</option>'; });
        var regionFilterOptions = '<option value="all">全部区域</option>';
        allRegions.forEach(function(r){ regionFilterOptions += '<option value="'+r+'">'+r+'</option>'; });

        html += '<div class="list-section">';
        html += '<h3>📋 情报列表 <select id="eventFilter" onchange="filterEvents()">'+eventFilterOptions+'</select><select id="regionFilter" onchange="filterEvents()">'+regionFilterOptions+'</select></h3>';
        html += '<table class="list-table"><thead><tr><th>标题</th><th>日期</th><th>来源</th><th>技术标签</th><th>场景标签</th><th>智能级别</th></tr></thead><tbody id="eventList"></tbody></table>';
        html += '</div>';

        container.innerHTML = html;

        // Month line chart
        var monthChart = echarts.init(document.getElementById('monthChart'));
        monthChart.setOption({
            tooltip: { trigger:'axis' },
            grid: { left:'8%', right:'4%', bottom:'15%', top:'8%', containLabel:true },
            xAxis: { type:'category', data: months, axisLabel: { rotate: 30, fontSize: 10 } },
            yAxis: { type:'value', name:'情报数量' },
            series: [{
                type:'line', data: monthValues, smooth: true,
                lineStyle: { color: '#1565C0', width: 2 },
                areaStyle: { color: 'rgba(21,101,192,0.1)' },
                itemStyle: { color: '#1565C0' },
                symbol: 'circle', symbolSize: 6
            }]
        });

        // Event type pie
        var pieData = Object.keys(typeCount).map(function(k){ return { name: eventTypeMap[k] || k, value: typeCount[k] }; });
        var pieColors = ['#1565C0','#00897B','#e67e22','#8e44ad','#27ae60','#c62828'];
        var typePie = echarts.init(document.getElementById('typePie'));
        typePie.setOption({
            tooltip: { trigger:'item', formatter:'{b}: {c} ({d}%)' },
            series: [{
                type:'pie', radius:['35%','60%'], center:['50%','50%'],
                data: pieData,
                label: { fontSize: 11 },
                itemStyle: { borderRadius: 6, borderColor:'#fff', borderWidth: 2 },
                color: pieColors,
                emphasis: { itemStyle: { shadowBlur:10, shadowColor:'rgba(0,0,0,0.2)' } }
            }]
        });

        // Heatmap
        var heatChart = echarts.init(document.getElementById('heatChart'));
        heatChart.setOption({
            tooltip: {
                position: 'top',
                formatter: function(p){
                    return techNameMap[techs[p.data[1]]] + ' × ' + sceneNameMap[scenes[p.data[0]]] + '<br/>数量: ' + p.data[2];
                }
            },
            grid: { left: '16%', right: '4%', bottom: '15%', top: '6%', containLabel: true },
            xAxis: { type: 'category', data: scenes.map(function(s){ return sceneNameMap[s]; }), axisLabel: { rotate: 20, fontSize: 11 }, splitArea: { show: true } },
            yAxis: { type: 'category', data: techs.map(function(t){ return techNameMap[t]; }), axisLabel: { fontSize: 11 }, splitArea: { show: true } },
            visualMap: {
                min: 0, max: Math.max.apply(null, heatData.map(function(d){ return d[2]; })) || 5,
                calculable: true, orient: 'horizontal', left: 'center', bottom: 0,
                inRange: { color: ['#e8f0fe','#90caf9','#42a5f5','#1565C0','#0d47a1'] }
            },
            series: [{
                type: 'heatmap', data: heatData,
                label: { show: true, fontSize: 11, color: '#333' },
                emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.3)' } }
            }]
        });

        // Resize
        window.addEventListener('resize', function(){
            monthChart.resize(); typePie.resize(); heatChart.resize();
        });

        // Event list filtering
        window.filterEvents = function(){
            var typeFilter = document.getElementById('eventFilter').value;
            var regionFilter = document.getElementById('regionFilter').value;
            var tbody = document.getElementById('eventList');
            tbody.innerHTML = '';
            var filtered = records.filter(function(r){
                return (typeFilter === 'all' || r.event_type === typeFilter) &&
                       (regionFilter === 'all' || r.region === regionFilter);
            });
            filtered.sort(function(a,b){ return b.date.localeCompare(a.date); });
            filtered.forEach(function(r){
                var tr = document.createElement('tr');
                var typeName = eventTypeMap[r.event_type] || r.event_type;
                var typeColor = eventTypeColors[r.event_type] || 'blue';
                var techTags = (r.tech_tags||[]).map(function(t){ return '<span class="tag">'+(techNameMap[t]||t)+'</span>'; }).join('');
                var sceneTags = (r.scene_tags||[]).map(function(s){ return '<span class="tag green">'+(sceneNameMap[s]||s)+'</span>'; }).join('');
                var levelLabel = smartLevelMap[r.smart_level] || r.smart_level;
                var levelClass = r.smart_level || 'passive';
                tr.innerHTML = '<td><span class="tag '+typeColor+'">'+typeName+'</span> '+r.title+'</td><td>'+r.date+'</td><td>'+r.source+'</td><td>'+techTags+'</td><td>'+sceneTags+'</td><td><span class="tag '+levelClass+'">'+levelLabel+'</span></td>';
                tbody.appendChild(tr);
            });
        };
        window.filterEvents();

        // ===== 技术创新雷达模块（基于84条真实情报统计） =====

        // 技术方向定义（与techNameMap一致）
        var techCodeList = ['conductive-fiber','flexible-sensor','energy-harvesting','embedded-circuit','communication','integration'];

        // 统计各技术方向每年的情报数作为活跃度分数（归一化到0-10）
        function calcTechScores(records, techCodes) {
            var yearRanges = ['2023','2024','2025','2026','2027'];
            var result = {};
            techCodes.forEach(function(code) { result[code] = {}; });
            records.forEach(function(r) {
                var y = r.date.substring(0,4);
                if (y < '2023') y = '2023';
                if (r.tech_tags) {
                    r.tech_tags.forEach(function(t) {
                        if (result[t]) {
                            if (!result[t][y]) result[t][y] = 0;
                            result[t][y]++;
                        }
                    });
                }
            });
            // 归一化到0-10
            var maxVal = 1;
            techCodes.forEach(function(code) {
                yearRanges.forEach(function(y) {
                    if (result[code][y] && result[code][y] > maxVal) maxVal = result[code][y];
                });
            });
            techCodes.forEach(function(code) {
                yearRanges.forEach(function(y) {
                    result[code][y] = Math.round(((result[code][y] || 0) / maxVal) * 10);
                });
            });
            return result;
        }

        var techScores = calcTechScores(records, techCodeList);

        var radarYears = ['2023','2024','2025','2026','2027'];
        var radarCurrentYear = 2026;
        var radarCurrentIdx = 0;

        // 技术详情关键词（来自真实数据的tech_tags分布）
        var radarTechDetails = [
            { keywords: ['碳纳米管','银纳米线','导电率','柔性电路','石墨烯'] },
            { keywords: ['压阻','电容','应变','生理监测','无感穿戴'] },
            { keywords: ['压电','热电','摩擦电','能量管理','柔性电池'] },
            { keywords: ['电致变色','光致变色','温致变色','光子晶体','可逆'] },
            { keywords: ['蓝牙','NFC','5G','低功耗','短距通信'] },
            { keywords: ['纺织-电子','集成工艺','封装','编织法','层压'] }
        ];

        // 追加技术雷达区HTML
        html += '<div style="margin-top:32px;"><h2 style="font-size:20px;color:#1565C0;padding-left:12px;border-left:4px solid #1565C0;margin-bottom:16px;">🔬 技术方向深度评估</h2></div>';

        // 统计卡片（从真实数据统计）
        var techYearCounts = {};
        radarYears.forEach(function(y) {
            techYearCounts[y] = records.filter(function(r) { return r.date.substring(0,4) === y; }).length;
        });
        var changeVal = (techYearCounts['2026'] || 0) - (techYearCounts['2025'] || 0);
        var changeStr2 = (changeVal > 0 ? '+' : '') + changeVal;

        html += '<div class="stats-row">';
        html += '<div class="stat-card"><div class="num">'+techCodeList.length+'</div><div class="label">技术方向数</div></div>';
        html += '<div class="stat-card"><div class="num">'+(techYearCounts['2026']||0)+'</div><div class="label">2026年情报数</div></div>';
        html += '<div class="stat-card"><div class="num">'+changeStr2+'</div><div class="label">年度变化(2025→2026)</div></div>';
        html += '<div class="stat-card"><div class="num">'+(techYearCounts['2023']||0)+'→'+(techYearCounts['2026']||0)+'</div><div class="label">4年情报增长</div></div>';
        html += '<div class="stat-card"><div class="num">'+total+'</div><div class="label">总情报数</div></div>';
        html += '</div>';

        // 雷达图
        html += '<div class="chart-box">';
        html += '<h3>📡 技术方向雷达图（基于真实情报密度）</h3>';
        html += '<div class="controls" style="display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;">';
        html += '<label style="font-size:14px;font-weight:500;color:#555;">选择年份：</label>';
        html += '<input type="range" id="radarSlider" min="2023" max="2027" value="2026" step="1" oninput="updateRadarChart()" style="width:300px;accent-color:#1565C0;">';
        html += '<span class="year-label" id="radarYearDisplay" style="font-size:18px;font-weight:700;color:#1565C0;min-width:60px;">2026</span>';
        html += '</div>';
        html += '<div id="radarChart" style="width:100%;height:480px;"></div>';
        html += '</div>';

        // 技术卡片
        html += '<div class="tech-cards" id="radarCards" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;">' + renderRadarCards() + '</div>';

        // 详情面板
        html += '<div class="detail-panel" id="radarDetailPanel" style="background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06);margin-bottom:20px;display:none;">';
        html += '<h4 id="radarDetailName" style="font-size:18px;color:#1565C0;margin-bottom:10px;"></h4>';
        html += '<p id="radarDetailDesc" style="font-size:14px;color:#555;line-height:1.8;"></p>';
        html += '<div id="radarDetailBars" style="margin-top:8px;"></div>';
        html += '<p id="radarDetailKeywords" style="margin-top:8px;font-size:14px;color:#555;"></p>';
        html += '</div>';

        container.innerHTML = html;

        // 渲染雷达图
        renderRadarChart(2026);
        showRadarDetail(0);

        // 雷达图具体函数
        function renderRadarCards() {
            var h = '';
            techCodeList.forEach(function(code, i) {
                var name = techNameMap[code] || code;
                var activeClass = i === radarCurrentIdx ? ' active' : '';
                var curScore = (techScores[code] && techScores[code][String(radarCurrentYear)]) || 0;
                var s2023 = (techScores[code] && techScores[code]['2023']) || 0;
                var s2026 = (techScores[code] && techScores[code]['2026']) || 0;
                h += '<div class="tech-card'+activeClass+'" onclick="selectRadarTech('+i+')" style="background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border-left:4px solid #1565C0;cursor:pointer;transition:all .2s;';
                h += i === radarCurrentIdx ? 'border-left-color:#00897B;background:#f0faf8;' : '';
                h += '">';
                h += '<h4 style="font-size:15px;color:#1565C0;margin-bottom:6px;">'+name+'</h4>';
                h += '<div class="meta" style="font-size:12px;color:#888;margin-bottom:4px;">📊 当前活跃度: '+curScore+'/10</div>';
                h += '<div class="meta" style="font-size:12px;color:#888;margin-bottom:4px;">📈 趋势: '+s2023+' → '+s2026+'</div>';
                h += '<div class="tags" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">'+(radarTechDetails[i] ? radarTechDetails[i].keywords.slice(0,3).map(function(k){ return '<span style="background:#e3f2fd;color:#1565C0;padding:2px 8px;border-radius:10px;font-size:11px;">'+k+'</span>'; }).join('') : '')+'</div>';
                h += '</div>';
            });
            return h;
        }

        window.selectRadarTech = function(idx) {
            radarCurrentIdx = idx;
            showRadarDetail(idx);
            document.getElementById('radarCards').innerHTML = renderRadarCards();
        };

        window.updateRadarChart = function() {
            var slider = document.getElementById('radarSlider');
            var year = parseInt(slider.value);
            document.getElementById('radarYearDisplay').textContent = year;
            radarCurrentYear = year;
            renderRadarChart(year);
            document.getElementById('radarCards').innerHTML = renderRadarCards();
            showRadarDetail(radarCurrentIdx);
        };

        function renderRadarChart(year) {
            var existing = echarts.getInstanceByDom(document.getElementById('radarChart'));
            if (existing) existing.dispose();
            var chart = echarts.init(document.getElementById('radarChart'));
            var seriesData = radarYears.map(function(y, i) {
                var c = ['#1565C0','#42a5f5','#00897B','#e67e22','#8e44ad'][i];
                var isHighlight = (y === String(year));
                return {
                    name: y,
                    type: 'radar',
                    data: [techCodeList.map(function(code) { return (techScores[code] && techScores[code][y]) || 0; })],
                    areaStyle: isHighlight ? { color: 'rgba(21,101,192,0.12)' } : { opacity: 0 },
                    lineStyle: { color: c, width: isHighlight ? 3 : 1.5, opacity: isHighlight ? 1 : 0.4 },
                    itemStyle: { color: c, opacity: 1 }
                };
            });
            chart.setOption({
                tooltip: { trigger: 'item', formatter: function(p) { return p.seriesName + '<br/>' + p.name + ': ' + p.value; } },
                legend: { data: radarYears, bottom: 0, textStyle: { fontSize: 12 } },
                radar: {
                    indicator: techCodeList.map(function(code) { return { name: techNameMap[code] || code, max: 10 }; }),
                    shape: 'polygon',
                    splitNumber: 5,
                    name: { textStyle: { fontSize: 13, color: '#333' } },
                    splitLine: { lineStyle: { color: '#e0e8f0' } },
                    splitArea: { areaStyle: { color: ['rgba(21,101,192,0.02)','rgba(21,101,192,0.04)'] } },
                    axisLine: { lineStyle: { color: '#ddd' } }
                },
                series: seriesData
            });
            window.addEventListener('resize', function() { chart.resize(); });
            return chart;
        }

        function showRadarDetail(idx) {
            var code = techCodeList[idx];
            var name = techNameMap[code] || code;
            var det = radarTechDetails[idx] || { keywords: [] };
            var panel = document.getElementById('radarDetailPanel');
            panel.style.display = 'block';
            document.getElementById('radarDetailName').textContent = name + ' 技术详情';
            var scores2023 = (techScores[code] && techScores[code]['2023']) || 0;
            var scores2026 = (techScores[code] && techScores[code]['2026']) || 0;
            document.getElementById('radarDetailDesc').textContent = '该技术在2023至2026年间情报活跃度从'+scores2023+'提升至'+scores2026+'。数据基于 '+total+' 条情报的 tech_tags 统计。';
            var barsDiv = document.getElementById('radarDetailBars');
            barsDiv.innerHTML = '';
            ['2024','2025','2026'].forEach(function(y) {
                var v = (techScores[code] && techScores[code][y]) || 0;
                var w = document.createElement('div');
                w.style.cssText = 'margin:8px 0;';
                w.innerHTML = '<div style="font-size:13px;display:flex;justify-content:space-between;"><span>'+y+'年 活跃度</span><span>'+v+'/10</span></div><div style="height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-top:3px;"><div style="height:100%;background:linear-gradient(90deg,#1565C0,#42a5f5);border-radius:4px;width:'+(v*10)+'%;transition:width .3s;"></div></div>';
                barsDiv.appendChild(w);
            });
            document.getElementById('radarDetailKeywords').innerHTML = '<strong>关键词：</strong>' + det.keywords.join('、');
        }

        // 扩展resize
        window.addEventListener('resize', function(){
            monthChart.resize(); typePie.resize(); heatChart.resize();
            var rc = echarts.getInstanceByDom(document.getElementById('radarChart'));
            if (rc) rc.resize();
        });
    }

    // Check if data is already loaded
    if(typeof window.SMART_TEXTILE_DATA !== 'undefined' && typeof window.DASHBOARD_SUMMARY !== 'undefined'){
        initPage();
    } else {
        // Wait for data scripts
        var checkInterval = setInterval(function(){
            if(typeof window.SMART_TEXTILE_DATA !== 'undefined' && typeof window.DASHBOARD_SUMMARY !== 'undefined'){
                clearInterval(checkInterval);
                initPage();
            }
        }, 100);
        setTimeout(function(){
            clearInterval(checkInterval);
            if(document.getElementById('loadingIndicator')){
                container.innerHTML = '<div class="error-msg">❌ 数据加载超时，请刷新页面重试。</div>';
            }
        }, 5000);
    }
})();
</script>
</body>
</html>
